<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strands Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #06060e;
  --sidebar-bg:  rgba(8,8,18,0.95);
  --surface:     rgba(255,255,255,0.04);
  --surface-2:   rgba(255,255,255,0.08);
  --surface-3:   rgba(255,255,255,0.12);
  --border:      rgba(255,255,255,0.08);
  --border-2:    rgba(255,255,255,0.15);
  --accent:      #8b5cf6;
  --accent-dim:  rgba(139,92,246,0.15);
  --accent-glow: rgba(139,92,246,0.25);
  --cyan:        #06b6d4;
  --from:        #7c3aed;
  --to:          #2563eb;
  --red:         rgba(239,68,68,0.12);
  --red-border:  rgba(239,68,68,0.3);
  --red-text:    #fca5a5;
  --text:        #f1f5f9;
  --text-2:      #94a3b8;
  --text-3:      #475569;
  --text-4:      #334155;
  --sidebar-w:   260px;
}

html, body { height: 100%; font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

/* ── Aurora ─────────────────────────────────────── */
.aurora { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
.orb { position: absolute; border-radius: 50%; filter: blur(110px); }
.orb-1 { width: 650px; height: 650px; background: radial-gradient(circle, #7c3aed 0%, transparent 70%); top: -180px; left: -180px; opacity: .12; animation: f1 14s ease-in-out infinite alternate; }
.orb-2 { width: 550px; height: 550px; background: radial-gradient(circle, #0ea5e9 0%, transparent 70%); bottom: -130px; right: -130px; opacity: .11; animation: f2 11s ease-in-out infinite alternate; }
.orb-3 { width: 320px; height: 320px; background: radial-gradient(circle, #06b6d4 0%, transparent 70%); top: 45%; left: 55%; opacity: .06; animation: f3 18s ease-in-out infinite alternate; }
@keyframes f1 { from { transform: translate(0,0) scale(1); } to { transform: translate(60px,35px) scale(1.1); } }
@keyframes f2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-45px,-55px) scale(1.13); } }
@keyframes f3 { from { transform: translate(-50%,-50%) scale(1); } to { transform: translate(-50%,-50%) scale(1.35) rotate(40deg); } }

/* ── Layout ─────────────────────────────────────── */
.layout {
  position: relative;
  z-index: 1;
  display: flex;
  height: 100vh;
}

/* ── Sidebar ─────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  backdrop-filter: blur(24px);
  overflow: hidden;
  transition: transform 0.25s ease;
}

.sidebar-head {
  padding: 16px 14px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.logo {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 12px;
}
.logo-mark {
  width: 30px; height: 30px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--from), var(--cyan));
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.logo-text {
  font-size: 12px; font-weight: 700; letter-spacing: .1em;
  background: linear-gradient(135deg, #fff 0%, var(--text-2) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.new-chat-btn {
  width: 100%;
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text-2);
  font-family: inherit; font-size: 13px; font-weight: 500;
  padding: 8px 12px;
  cursor: pointer;
  transition: all .18s;
}
.new-chat-btn:hover { background: var(--surface-3); border-color: var(--border-2); color: var(--text); }
.new-chat-btn svg { flex-shrink: 0; }

/* Session list */
.session-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px 8px;
}
.session-list::-webkit-scrollbar { width: 3px; }
.session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.session-group-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  color: var(--text-4);
  padding: 8px 8px 4px;
  text-transform: uppercase;
}

.session-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-3);
  transition: all .15s;
  position: relative;
  min-width: 0;
}
.session-item:hover { background: var(--surface-2); color: var(--text-2); }
.session-item.active { background: var(--accent-dim); color: var(--text); }
.session-item.active .session-icon { color: var(--accent); }

.session-icon { flex-shrink: 0; color: var(--text-4); }
.session-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session-del {
  flex-shrink: 0;
  width: 20px; height: 20px;
  border-radius: 5px;
  border: none;
  background: none;
  color: var(--text-4);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: all .15s;
  padding: 0;
}
.session-item:hover .session-del { opacity: 1; }
.session-del:hover { background: var(--red); color: var(--red-text); }

.sidebar-empty {
  padding: 24px 12px;
  text-align: center;
  font-size: 12px;
  color: var(--text-4);
  line-height: 1.6;
}

/* ── Main ─────────────────────────────────────────── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* Header */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  background: rgba(6,6,14,.85);
  backdrop-filter: blur(24px);
  flex-shrink: 0;
  gap: 12px;
}
.hamburger {
  display: none;
  width: 34px; height: 34px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  cursor: pointer;
  align-items: center; justify-content: center;
  flex-shrink: 0;
}
.session-title-bar {
  flex: 1;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.mode-wrap {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 3px;
  gap: 2px;
}
.mode-btn {
  font-family: inherit; font-size: 12px; font-weight: 500;
  background: none; border: none;
  color: var(--text-3);
  padding: 5px 12px;
  border-radius: 7px;
  cursor: pointer;
  transition: all .18s;
  white-space: nowrap;
}
.mode-btn:hover { color: var(--text-2); }
.mode-btn.active { background: var(--accent); color: #fff; box-shadow: 0 0 10px var(--accent-glow); }
.tts-btn {
  width: 34px; height: 34px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-3);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .18s;
  position: relative;
}
.tts-btn:hover { border-color: var(--border-2); color: var(--text-2); }
.tts-btn.on { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.tts-badge {
  position: absolute; top: -3px; right: -3px;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg);
  display: none;
}
.tts-btn.on .tts-badge { display: block; }

/* Messages */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Welcome */
.welcome {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  text-align: center;
  padding: 40px 20px;
  animation: fade-in .5s ease-out;
}
@keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.welcome-mark {
  width: 64px; height: 64px;
  border-radius: 20px;
  background: linear-gradient(135deg, var(--from), var(--cyan));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 36px rgba(139,92,246,.3);
  margin-bottom: 4px;
}
.welcome h2 { font-size: 20px; font-weight: 700; }
.welcome p { font-size: 14px; color: var(--text-3); line-height: 1.7; max-width: 320px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
.chip {
  font-size: 12px; color: var(--text-2);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 6px 14px;
  cursor: pointer; transition: all .18s;
}
.chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

/* Message */
.msg { display: flex; gap: 10px; animation: msg-in .22s ease-out; }
@keyframes msg-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.msg.user { flex-direction: row-reverse; }
.av {
  width: 30px; height: 30px;
  border-radius: 9px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  align-self: flex-end;
}
.av.ai { background: linear-gradient(135deg, var(--from), var(--cyan)); color: #fff; }
.av.you { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-3); }
.bubble {
  max-width: 72%;
  padding: 11px 15px;
  font-size: 14px; line-height: 1.75;
  word-break: break-word;
}
.msg.agent .bubble {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px 18px 18px 4px; color: var(--text);
}
.msg.user .bubble {
  background: linear-gradient(135deg, var(--from), var(--to));
  border-radius: 18px 18px 4px 18px; color: #fff;
}
.msg.err .bubble {
  background: var(--red); border: 1px solid var(--red-border);
  border-radius: 18px 18px 18px 4px; color: var(--red-text);
}

/* Markdown */
.bubble h1,.bubble h2,.bubble h3 { font-weight: 600; margin: 10px 0 5px; }
.bubble h1 { font-size: 17px; } .bubble h2 { font-size: 15px; } .bubble h3 { font-size: 14px; }
.bubble p { margin-bottom: 7px; } .bubble p:last-child { margin-bottom: 0; }
.bubble ul,.bubble ol { padding-left: 18px; margin-bottom: 7px; }
.bubble li { margin-bottom: 3px; }
.bubble a { color: var(--cyan); text-decoration: underline; }
.bubble strong { font-weight: 600; }
.bubble code { font-family: 'Menlo','Monaco',monospace; font-size: 12px; background: rgba(255,255,255,.1); padding: 2px 5px; border-radius: 4px; }
.bubble pre { background: rgba(0,0,0,.45); border: 1px solid var(--border); border-radius: 10px; padding: 12px; overflow-x: auto; margin: 8px 0; }
.bubble pre code { background: none; padding: 0; }
.bubble blockquote { border-left: 3px solid var(--accent); padding-left: 10px; color: var(--text-2); margin: 6px 0; }
.bubble table { border-collapse: collapse; width: 100%; margin: 6px 0; }
.bubble th,.bubble td { border: 1px solid var(--border); padding: 5px 9px; font-size: 13px; }
.bubble th { background: var(--surface-2); font-weight: 600; }

/* Typing */
.typing-row { display: flex; gap: 10px; align-items: flex-end; }
.typing-bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 18px 18px 18px 4px; padding: 13px 16px; display: flex; gap: 5px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); animation: bounce 1.2s ease-in-out infinite; }
.dot:nth-child(2) { animation-delay: .18s; }
.dot:nth-child(3) { animation-delay: .36s; }
@keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-7px); opacity: 1; } }

/* Input */
.input-area {
  padding: 12px 20px 18px;
  border-top: 1px solid var(--border);
  background: rgba(6,6,14,.85);
  backdrop-filter: blur(24px);
  flex-shrink: 0;
}
.input-wrap {
  display: flex; align-items: flex-end; gap: 9px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 9px 9px 9px 15px;
  transition: border-color .2s, box-shadow .2s;
}
.input-wrap:focus-within { border-color: rgba(139,92,246,.45); box-shadow: 0 0 0 3px rgba(139,92,246,.1); }
textarea {
  flex: 1; background: none; border: none; outline: none; resize: none;
  color: var(--text); font-family: inherit; font-size: 14px; line-height: 1.65;
  max-height: 130px; overflow-y: auto; padding: 0;
}
textarea::placeholder { color: var(--text-3); }
.send-btn {
  width: 36px; height: 36px; border-radius: 10px; border: none;
  background: linear-gradient(135deg, var(--from), var(--to));
  color: #fff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all .18s;
  box-shadow: 0 2px 10px rgba(124,58,237,.4);
}
.send-btn:hover:not(:disabled) { opacity: .87; transform: scale(1.05); box-shadow: 0 4px 18px rgba(124,58,237,.55); }
.send-btn:active:not(:disabled) { transform: scale(.95); }
.send-btn:disabled { opacity: .3; cursor: not-allowed; box-shadow: none; }
.input-hint { margin-top: 7px; text-align: center; font-size: 11px; color: var(--text-4); }

/* Overlay (mobile) */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; }

/* Responsive */
@media (max-width: 680px) {
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 60; transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .overlay.show { display: block; }
  .hamburger { display: flex; }
}
</style>
</head>
<body>

<div class="aurora" aria-hidden="true">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="overlay" id="overlay"></div>

<div class="layout">

  <!-- ── Sidebar ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="logo">
        <div class="logo-mark">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L3 7v10l9 5 9-5V7L12 2z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M12 2v20M3 7l9 5 9-5" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="logo-text">STRANDS AGENT</span>
      </div>
      <button class="new-chat-btn" id="newChatBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        新しいチャット
      </button>
    </div>
    <div class="session-list" id="sessionList">
      <div class="sidebar-empty">まだ会話がありません</div>
    </div>
  </aside>

  <!-- ── Main ── -->
  <div class="main">
    <header>
      <button class="hamburger" id="hamburger" title="メニュー">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <span class="session-title-bar" id="sessionTitleBar">新しいチャット</span>
      <div class="controls">
        <div class="mode-wrap">
          <button class="mode-btn active" data-mode="simple">シンプル</button>
          <button class="mode-btn" data-mode="multi">マルチエージェント</button>
        </div>
        <button class="tts-btn on" id="ttsBtn">
          <div class="tts-badge"></div>
          <svg id="ttsIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-mark">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L3 7v10l9 5 9-5V7L12 2z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M12 2v20M3 7l9 5 9-5" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2>Strands Agent へようこそ</h2>
        <p>AIエージェントに何でも話しかけてみてください。</p>
        <div class="chips">
          <span class="chip" data-prompt="こんにちは！何ができますか？">できること</span>
          <span class="chip" data-prompt="おすすめの車を教えてください">おすすめの車</span>
          <span class="chip" data-prompt="Pythonでシンプルなwebサーバーを書いて">Pythonコード</span>
          <span class="chip" data-prompt="今日の天気は？">天気</span>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="input" placeholder="メッセージを入力..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">Enter で送信 &nbsp;·&nbsp; Shift+Enter で改行</div>
    </div>
  </div>
</div>

<script>
// ── Elements ─────────────────────────────────────────────
const messagesEl   = document.getElementById('messages');
const inputEl      = document.getElementById('input');
const sendBtn      = document.getElementById('sendBtn');
const ttsBtn       = document.getElementById('ttsBtn');
const ttsIcon      = document.getElementById('ttsIcon');
const newChatBtn   = document.getElementById('newChatBtn');
const sessionList  = document.getElementById('sessionList');
const titleBar     = document.getElementById('sessionTitleBar');
const sidebar      = document.getElementById('sidebar');
const overlay      = document.getElementById('overlay');
const hamburger    = document.getElementById('hamburger');

// ── State ─────────────────────────────────────────────────
let mode      = 'simple';
let ttsOn     = true;
let busy      = false;
let currentId = null;   // active session id
let welcome   = document.getElementById('welcome');

const ICON_ON  = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>`;
const ICON_OFF = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>`;

// ── Sidebar toggle (mobile) ────────────────────────────────
hamburger.addEventListener('click', () => {
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show');
});
overlay.addEventListener('click', closeSidebar);
function closeSidebar() {
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
}

// ── Mode toggle ────────────────────────────────────────────
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
  });
});

// ── TTS toggle ─────────────────────────────────────────────
ttsBtn.addEventListener('click', () => {
  ttsOn = !ttsOn;
  ttsBtn.classList.toggle('on', ttsOn);
  ttsIcon.innerHTML = ttsOn ? ICON_ON : ICON_OFF;
});

// ── Chips ──────────────────────────────────────────────────
document.querySelectorAll('.chip').forEach(c => {
  c.addEventListener('click', () => {
    inputEl.value = c.dataset.prompt;
    autoResize();
    inputEl.focus();
    sendMessage();
  });
});

// ── Textarea ───────────────────────────────────────────────
function autoResize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + 'px';
}
inputEl.addEventListener('input', autoResize);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
sendBtn.addEventListener('click', sendMessage);

// ── Session list rendering ─────────────────────────────────
function groupByDate(sessions) {
  const now   = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const yest  = today - 86400000;
  const week  = today - 7 * 86400000;

  const groups = { '今日': [], '昨日': [], '先週': [], 'もっと前': [] };
  for (const s of sessions) {
    const d   = new Date(s.updated_at);
    const day = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    if      (day >= today) groups['今日'].push(s);
    else if (day >= yest)  groups['昨日'].push(s);
    else if (day >= week)  groups['先週'].push(s);
    else                   groups['もっと前'].push(s);
  }
  return groups;
}

async function loadSessionList() {
  const res = await fetch('/api/sessions');
  const sessions = await res.json();

  if (!sessions.length) {
    sessionList.innerHTML = '<div class="sidebar-empty">まだ会話がありません</div>';
    return;
  }

  const groups = groupByDate(sessions);
  sessionList.innerHTML = '';

  for (const [label, items] of Object.entries(groups)) {
    if (!items.length) continue;
    const gl = document.createElement('div');
    gl.className = 'session-group-label';
    gl.textContent = label;
    sessionList.appendChild(gl);

    for (const s of items) {
      sessionList.appendChild(buildSessionItem(s));
    }
  }
}

function buildSessionItem(s) {
  const item = document.createElement('div');
  item.className = 'session-item' + (s.id === currentId ? ' active' : '');
  item.dataset.id = s.id;
  item.innerHTML = `
    <svg class="session-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <span class="session-title">${escHtml(s.title)}</span>
    <button class="session-del" title="削除" data-id="${s.id}">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>`;

  item.addEventListener('click', e => {
    if (e.target.closest('.session-del')) return;
    openSession(s.id);
    closeSidebar();
  });
  item.querySelector('.session-del').addEventListener('click', async e => {
    e.stopPropagation();
    await fetch(`/api/sessions/${s.id}`, { method: 'DELETE' });
    if (currentId === s.id) newChat();
    else loadSessionList();
  });
  return item;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setActiveItem(id) {
  document.querySelectorAll('.session-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
}

// ── Open / load session ────────────────────────────────────
async function openSession(id) {
  currentId = id;
  localStorage.setItem('lastSessionId', id);
  setActiveItem(id);

  const res     = await fetch(`/api/sessions/${id}`);
  const session = await res.json();

  clearMessages();
  titleBar.textContent = session.title;

  // Restore mode
  const modeBtns = document.querySelectorAll('.mode-btn');
  modeBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === session.mode));
  mode = session.mode;

  if (!session.messages.length) {
    showWelcome();
    return;
  }
  for (const m of session.messages) {
    addMsg(m.role, m.content);
  }
}

// ── New chat ───────────────────────────────────────────────
async function newChat() {
  const res     = await fetch('/api/sessions', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ mode }) });
  const session = await res.json();
  currentId     = session.id;
  localStorage.setItem('lastSessionId', currentId);

  clearMessages();
  showWelcome();
  titleBar.textContent = '新しいチャット';
  await loadSessionList();
  closeSidebar();
}
newChatBtn.addEventListener('click', newChat);

// ── Messages helpers ───────────────────────────────────────
function clearMessages() {
  messagesEl.innerHTML = '';
  welcome = null;
}
function showWelcome() {
  const w = document.createElement('div');
  w.className = 'welcome';
  w.id = 'welcome';
  w.innerHTML = `
    <div class="welcome-mark">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L3 7v10l9 5 9-5V7L12 2z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12 2v20M3 7l9 5 9-5" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2>Strands Agent へようこそ</h2>
    <p>AIエージェントに何でも話しかけてみてください。</p>
    <div class="chips">
      <span class="chip" data-prompt="こんにちは！何ができますか？">できること</span>
      <span class="chip" data-prompt="おすすめの車を教えてください">おすすめの車</span>
      <span class="chip" data-prompt="Pythonでシンプルなwebサーバーを書いて">Pythonコード</span>
      <span class="chip" data-prompt="今日の天気は？">天気</span>
    </div>`;
  w.querySelectorAll('.chip').forEach(c => {
    c.addEventListener('click', () => { inputEl.value = c.dataset.prompt; autoResize(); inputEl.focus(); sendMessage(); });
  });
  messagesEl.appendChild(w);
  welcome = w;
}

function removeWelcome() {
  if (welcome) { welcome.remove(); welcome = null; }
}

function addMsg(role, content, isErr = false) {
  removeWelcome();
  const row    = document.createElement('div');
  row.className = `msg ${role}${isErr ? ' err' : ''}`;

  const av = document.createElement('div');
  av.className = `av ${role === 'user' ? 'you' : 'ai'}`;
  av.textContent = role === 'user' ? 'You' : 'AI';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (role === 'agent' && !isErr) bubble.innerHTML = marked.parse(content);
  else bubble.textContent = content;

  row.appendChild(av);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  removeWelcome();
  const row = document.createElement('div');
  row.className = 'typing-row'; row.id = 'typing';
  const av = document.createElement('div');
  av.className = 'av ai'; av.textContent = 'AI';
  const b = document.createElement('div');
  b.className = 'typing-bubble';
  b.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  row.appendChild(av); row.appendChild(b);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function hideTyping() { document.getElementById('typing')?.remove(); }

// ── Send message ───────────────────────────────────────────
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || busy || !currentId) return;

  busy = true;
  sendBtn.disabled = true;
  addMsg('user', text);
  inputEl.value = ''; inputEl.style.height = 'auto';
  showTyping();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: currentId, mode, tts: ttsOn }),
    });
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.detail || `HTTP ${res.status}`); }
    const data = await res.json();
    hideTyping();
    addMsg('agent', data.response);

    // Update sidebar title
    await loadSessionList();

    if (data.audio) {
      const audio = new Audio(`data:audio/mp3;base64,${data.audio}`);
      audio.play().catch(() => {});
    }
  } catch (err) {
    hideTyping();
    addMsg('agent', `エラー: ${err.message}`, true);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

// ── Init ───────────────────────────────────────────────────
async function init() {
  const lastId = localStorage.getItem('lastSessionId');
  const res    = await fetch('/api/sessions');
  const sessions = await res.json();

  await loadSessionList();

  const existing = lastId && sessions.find(s => s.id === lastId);
  if (existing) {
    await openSession(lastId);
  } else {
    await newChat();
  }
}

init();
</script>
</body>
</html>
